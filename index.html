<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南山人壽 x 順可 | DISC人際風格分析</title>
    <meta property="og:title" content="南山人壽 x 順可 | DISC人際風格分析">

    <meta property="og:type" content="website">
    
    <style>
        :root {
            --nanshan-blue: #0056b3;
            --tiger: #FF8C00;
            --peacock: #E91E63;
            --koala: #4CAF50;
            --owl: #607D8B;
        }
        body { font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--nanshan-blue); font-size: 22px; margin: 5px 0; }
        
        .intro-card { background: white; padding: 25px; border-radius: 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 6px solid var(--nanshan-blue); }
        .instruction-box { background: #eef6ff; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-size: 15px; line-height: 1.6; color: #444; }
        
        .name-input-group { margin-top: 15px; }
        .name-input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--nanshan-blue); }
        .name-input-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 12px; font-size: 16px; box-sizing: border-box; }

        .question-card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-left: 6px solid var(--nanshan-blue); }
        .group-title { font-size: 18px; font-weight: bold; color: var(--nanshan-blue); margin-bottom: 15px; }

        .option-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed #eee; }
        .option-text { font-size: 16px; flex: 1; }
        select { appearance: none; background-color: #f9f9f9; border: 2px solid #ddd; padding: 8px; border-radius: 10px; font-size: 14px; width: 85px; text-align: center; font-weight: bold; color: var(--nanshan-blue); cursor: pointer; }

        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(135deg, #0056b3, #007bff); color: white; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; }

        #result-page { display: none; }
        .result-card { background: white; padding: 30px; border-radius: 30px; text-align: center; border: 3px solid var(--nanshan-blue); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .animal-icon { font-size: 80px; margin: 15px 0; }
        .type-name { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
        .score-pill { padding: 6px 15px; border-radius: 20px; font-size: 13px; color: white; font-weight: bold; margin: 4px; display: inline-block; }
        .desc-box { text-align: left; background: #f8f9fa; padding: 20px; border-radius: 15px; font-size: 15px; line-height: 1.8; border-left: 4px solid var(--nanshan-blue); }
    </style>
</head>
<body>

<div class="container">
    <div class="header" id="main-header">
        <div style="color:var(--nanshan-blue); font-weight: bold; font-size: 20px;">NAN SHAN 南山人壽</div>
        <h1>適性分析 DISC 測驗</h1>
    </div>

    <div id="quiz-page">
        <div class="intro-card">
            <div class="instruction-box">
                🌟 <strong>測驗說明：</strong><br>
                本測驗共有 A、B、C、D、E 五組題目。請在每組中依符合程度填入：<br>
                <strong>7分</strong> (最像自己) / <strong>5分</strong> / <strong>3分</strong> / <strong>1分</strong> (最不像自己)。<br>
                <span style="color:red;">*注意：每一組內的分數不可重複填寫！</span>
            </div>
            <div class="name-input-group">
                <label for="userName">您的姓名：</label>
                <input type="text" id="userName" placeholder="請輸入姓名以生成專屬報告" required>
            </div>
        </div>
        <form id="discForm"></form>
        <button type="button" class="btn-submit" onclick="processResult()">分析我的性格風格 ✨</button>
    </div>

    <div id="result-page">
        <div class="result-card">

            <div id="animal-emoji" class="animal-icon"></div>
            <div id="result-type-name" class="type-name"></div>
            <div id="result-score-pills" style="margin: 15px 0;"></div>
            <div id="result-explanation" class="desc-box"></div>
            <p style="color:#ff4757; font-weight:bold; margin-top:20px;">📸 請截圖保存結果傳給服務人員</p>
            <button class="btn-submit" style="margin-top:20px; background:#95a5a6;" onclick="window.location.reload()">重新測驗</button>
        </div>
    </div>
</div>

<script>
    // 這裡就是題目資料，一定要確保這段存在
    const data = [
        { g: 'A', options: [{t:'1. 堅定、固執', s:'D'}, {t:'2. 有說服力、善表達', s:'I'}, {t:'3. 溫和、文雅', s:'S'}, {t:'4. 謙虛、容忍', s:'C'}]},
        { g: 'B', options: [{t:'1. 喜歡冒險、膽大', s:'D'}, {t:'2. 團體中活力的來源', s:'I'}, {t:'3. 節制、穩健', s:'S'}, {t:'4. 嚴格、考究', s:'C'}]},
        { g: 'C', options: [{t:'1. 有決心、有決斷力', s:'D'}, {t:'2. 使人心服、善於遊說', s:'I'}, {t:'3. 善良、和諧', s:'S'}, {t:'4. 謹慎、小心', s:'C'}]},
        { g: 'D', options: [{t:'1. 有競爭性、有進取心', s:'D'}, {t:'2. 頑皮、開朗', s:'I'}, {t:'3. 親切、誠懇', s:'S'}, {t:'4. 順從、善思考', s:'C'}]},
        { g: 'E', options: [{t:'1. 堅持、有魄力', s:'D'}, {t:'2. 樂觀、好玩', s:'I'}, {t:'3. 寬大、仁慈', s:'S'}, {t:'4. 正確、準確', s:'C'}]}
    ];

    const form = document.getElementById('discForm');
    data.forEach(item => {
        let card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `<div class="group-title">組別 ${item.g} 評分</div>`;
        item.options.forEach(opt => {
            card.innerHTML += `
                <div class="option-item">
                    <span class="option-text">${opt.t}</span>
                    <select class="score-select" data-group="${item.g}" data-type="${opt.s}">
                        <option value="">評分</option>
                        <option value="7">7分</option>
                        <option value="5">5分</option>
                        <option value="3">3分</option>
                        <option value="1">1分</option>
                    </select>
                </div>`;
        });
        form.appendChild(card);
    });

    function processResult() {
        const name = document.getElementById('userName').value.trim();
        if (!name) { alert("請先填寫姓名喔！"); return; }
        let scores = { D: 0, I: 0, S: 0, C: 0 };
        const groups = ['A', 'B', 'C', 'D', 'E'];
        for (let g of groups) {
            let selects = document.querySelectorAll(`select[data-group="${g}"]`);
            let vals = Array.from(selects).map(s => s.value);
            if (vals.includes("")) { alert(`請完成 ${g} 組的所有評分。`); return; }
            if (new Set(vals).size !== 4) { alert(`${g} 組的分數不能重複喔！`); return; }
            selects.forEach(s => scores[s.dataset.type] += parseInt(s.value));
        }
        let winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        showResult(name, winner, scores);
    }

        document.getElementById('main-header').style.display = 'none';
        document.getElementById('result-page').style.display = 'block';
