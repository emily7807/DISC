<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>南山人壽 | DISC 人際風格分析</title>
    <style>
        :root {
            --nanshan-blue: #0056b3;
            --tiger: #FF8C00;
            --peacock: #E91E63;
            --koala: #4CAF50;
            --owl: #607D8B;
        }
        body { font-family: "PingFang TC", sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        h1 { color: var(--nanshan-blue); font-size: 22px; }
        
        /* 姓名輸入區 */
        .user-info { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .user-info input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; }

        .question-card { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-left: 6px solid var(--nanshan-blue); }
        .group-title { font-size: 18px; font-weight: bold; color: var(--nanshan-blue); margin-bottom: 10px; }
        .option-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed #eee; }
        select { padding: 8px; border-radius: 10px; border: 2px solid #ddd; font-weight: bold; color: var(--nanshan-blue); }

        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(135deg, #0056b3, #007bff); color: white; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; }

        /* 結果頁截圖優化 */
        #result-page { display: none; }
        .result-card { background: white; padding: 30px; border-radius: 30px; text-align: center; border: 3px solid var(--nanshan-blue); }
        .user-name-display { font-size: 20px; color: #666; margin-bottom: 5px; }
        .animal-icon { font-size: 70px; margin: 10px 0; }
        .type-name { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
        .score-pill { padding: 5px 12px; border-radius: 20px; font-size: 12px; color: white; font-weight: bold; margin: 3px; display: inline-block; }
        .screenshot-note { font-size: 13px; color: #ff4757; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header" id="main-header">
        <div style="color:#0056b3; font-weight: bold;">NAN SHAN 南山人壽</div>
        <h1>DISC 人際風格分析</h1>
    </div>

    <div id="quiz-page">
        <div class="user-info">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">請輸入您的姓名：</label>
            <input type="text" id="userName" placeholder="範例：王小明" required>
        </div>

        <form id="discForm"></form>
        <button type="button" class="btn-submit" onclick="processResult()">查看我的性格解說 ✨</button>
    </div>

    <div id="result-page">
        <div class="result-card" id="capture-area">
            <div style="font-size: 14px; color: #888;">南山人壽 適性分析結果</div>
            <div id="display-name" class="user-name-display"></div>
            <div id="animal-emoji" class="animal-icon"></div>
            <div id="result-type-name" class="type-name"></div>
            <div id="result-score-pills"></div>
            <div id="result-explanation" style="text-align:left; background:#f8f9fa; padding:15px; border-radius:15px; font-size:14px; margin-top:15px;"></div>
            <p class="screenshot-note">📸 溫馨提示：請截圖此畫面傳給您的服務人員</p>
        </div>
        <button class="btn-submit" style="margin-top:20px; background:#666;" onclick="window.location.reload()">重新測驗</button>
    </div>
</div>

<script>
    // 題目資料 (與之前相同)
    const data = [
        { g: 'A', options: [{t:'1. 堅定、固執', s:'D'}, {t:'2. 有說服力、善表達', s:'I'}, {t:'3. 溫和、文雅', s:'S'}, {t:'4. 謙虛、容忍', s:'C'}]},
        { g: 'B', options: [{t:'1. 喜歡冒險、膽大', s:'D'}, {t:'2. 團體中活力的來源', s:'I'}, {t:'3. 節制、穩健', s:'S'}, {t:'4. 嚴格、考究', s:'C'}]},
        { g: 'C', options: [{t:'1. 有決心、有決斷力', s:'D'}, {t:'2. 使人心服、善於遊說', s:'I'}, {t:'3. 善良、和諧', s:'S'}, {t:'4. 謹慎、小心', s:'C'}]},
        { g: 'D', options: [{t:'1. 有競爭性、有進取心', s:'D'}, {t:'2. 頑皮、開朗', s:'I'}, {t:'3. 親切、誠懇', s:'S'}, {t:'4. 順從、善思考', s:'C'}]},
        { g: 'E', options: [{t:'1. 堅持、有魄力', s:'D'}, {t:'2. 樂觀、好玩', s:'I'}, {t:'3. 寬大、仁慈', s:'S'}, {t:'4. 正確、準確', s:'C'}]}
    ];

    const form = document.getElementById('discForm');
    data.forEach(item => {
        let card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `<div class="group-title">組別 ${item.g}</div>`;
        item.options.forEach(opt => {
            card.innerHTML += `
                <div class="option-item">
                    <span style="flex:1">${opt.t}</span>
                    <select class="score-select" data-group="${item.g}" data-type="${opt.s}">
                        <option value="">評分</option>
                        <option value="7">7分</option>
                        <option value="5">5分</option>
                        <option value="3">3分</option>
                        <option value="1">1分</option>
                    </select>
                </div>`;
        });
        form.appendChild(card);
    });

    function processResult() {
        const name = document.getElementById('userName').value;
        if (!name) { alert("請填寫您的姓名喔！"); return; }

        let scores = { D: 0, I: 0, S: 0, C: 0 };
        const groups = ['A', 'B', 'C', 'D', 'E'];
        
        for (let g of groups) {
            let selects = document.querySelectorAll(`select[data-group="${g}"]`);
            let vals = Array.from(selects).map(s => s.value);
            if (vals.includes("")) { alert(`請完成 ${g} 組的所有評分。`); return; }
            if (new Set(vals).size !== 4) { alert(`${g} 組的分數不能重複喔！`); return; }
            selects.forEach(s => scores[s.dataset.type] += parseInt(s.value));
        }

        let winner = Object.keys(scores).reduce((a, b) => scores[a] > scores[b] ? a : b);
        showResult(name, winner, scores);
    }

    function showResult(name, type, allScores) {
        document.getElementById('quiz-page').style.display = 'none';
        document.getElementById('result-page').style.display = 'block';
        document.getElementById('display-name').innerText = name + " 的專屬性格特質：";

        const config = {
            'D': { name: '老虎型 (Dominance)', icon: '🐯', color: '#FF8C00', desc: '您是天生的領導者！追求效率與目標，具有獨立性格，喜歡做主，意志堅定且充滿自信。' },
            'I': { name: '孔雀型 (Influence)', icon: '🦚', color: '#E91E63', desc: '您是大家的開心果！熱愛社交，擅長遊說大家一起出發。在團體中充滿活力與魅力。' },
            'S': { name: '無尾熊型 (Steadiness)', icon: '🐨', color: '#4CAF50', desc: '您是最好的夥伴！性情溫和、誠懇且親切。追求穩定與和諧，是朋友心中最溫暖的後盾。' },
            'C': { name: '貓頭鷹型 (Conscientiousness)', icon: '🦉', color: '#607D8B', desc: '您是精確的大師！做事謹慎、考究且謙虛。注重細節與正確性，專業度深受信任。' }
        };

        const res = config[type];
        document.getElementById('animal-emoji').innerText = res.icon;
        document.getElementById('result-type-name').innerText = res.name;
        document.getElementById('result-type-name').style.color = res.color;
        document.getElementById('result-explanation').innerHTML = res.desc;
        document.getElementById('result-score-pills').innerHTML = `
            <div class="score-pill" style="background:var(--tiger)">老虎: ${allScores.D}</div>
            <div class="score-pill" style="background:var(--peacock)">孔雀: ${allScores.I}</div>
            <div class="score-pill" style="background:var(--koala)">無尾熊: ${allScores.S}</div>
            <div class="score-pill" style="background:var(--owl)">貓頭鷹: ${allScores.C}</div>
        `;
    }
</script>
</body>
</html>
