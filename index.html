        /* 題目卡片 */

        .group-title { font-size: 18px; font-weight: bold; color: var(--nanshan-blue); margin-bottom: 15px; display: flex; align-items: center; }

        .option-text { font-size: 16px; flex: 1; }
        select { appearance: none; background-color: #f9f9f9; border: 2px solid #ddd; padding: 8px; border-radius: 10px; font-size: 14px; width: 85px; text-align: center; font-weight: bold; color: var(--nanshan-blue); cursor: pointer; }

        .btn-submit { width: 100%; padding: 18px; background: linear-gradient(135deg, #0056b3, #007bff); color: white; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 15px rgba(0,86,179,0.3); transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); }

        .animal-icon { font-size: 80px; margin: 15px 0; }
        .type-name { font-size: 32px; font-weight: bold; margin-bottom: 15px; }
